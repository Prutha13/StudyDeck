[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Proxy API calls directly to Render backend to avoid CORS & SSL issues
[[redirects]]
  from = "/api/*"
  to = "https://studydeck-exg9.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
